name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only master writes to the shared cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Also runs inside `build`. Called separately so a style failure shows as
      # a named step.
      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest

      - name: Build, unit and integration tests
        run: ./gradlew --no-daemon build

      - name: Coverage report
        run: ./gradlew --no-daemon jacocoTestReport

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-analysis-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 14
          if-no-files-found: ignore
