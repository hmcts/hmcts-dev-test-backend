name: CI

# Every push on every branch, so a feature branch is checked before a pull
# request exists. Publishing is gated on the ref inside _image.yml.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

# master is excluded so release builds always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_build-test.yml

  terraform:
    uses: ./.github/workflows/_terraform-checks.yml
    permissions:
      contents: read
      security-events: write

  image:
    needs: [build-and-test, terraform]
    uses: ./.github/workflows/_image.yml
    with:
      image-name: hmcts/dev-test-backend
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      security-events: write

  # Single required status check. Branch protection points here, so adding a
  # job above never means editing repository settings.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [build-and-test, terraform, image]
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
          echo "All required checks passed."
