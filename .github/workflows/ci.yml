name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'feature/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'
  TERRAFORM_VERSION: 1.15.8

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Coverage report
        if: success()
        run: ./gradlew jacocoTestReport --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  static-analysis:
    name: Static analysis (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Checkstyle
        run: >-
          ./gradlew checkstyleMain checkstyleTest
          checkstyleIntegrationTest checkstyleFunctionalTest checkstyleSmokeTest
          --no-daemon --console=plain

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: ignore

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Repository        
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-test, static-analysis]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_ref: ${{ steps.meta.outputs.primary_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: meta
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PRIMARY="${IMAGE}:sha-${SHORT_SHA}"
          TAGS="${PRIMARY}"

          if [[ "${REF}" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            MAJOR_MINOR="${VERSION%.*}"
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:${MAJOR_MINOR},${IMAGE}:latest"
          elif [[ "${REF}" == "refs/heads/master" ]]; then
            TAGS="${TAGS},${IMAGE}:edge"
          else
            BRANCH_SLUG="$(printf '%s' "${REF#refs/heads/}" | tr '/_' '-' | tr -cd '[:alnum:]-' | cut -c1-40)"
            TAGS="${TAGS},${IMAGE}:${BRANCH_SLUG}-${RUN_NUMBER}"
          fi

          echo "primary_tag=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"


      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.primary_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy - CRITICAL (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Trivy - HIGH (warning)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Trivy - SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          provenance: true
          sbom: true

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create .env
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 24)|" .env

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Check health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:4000/health | tee /tmp/health.json
          echo
          curl --fail --silent --show-error http://localhost:4000/health/readiness | tee /tmp/readiness.json
          echo
          grep -q '"status":"UP"' /tmp/readiness.json
          # No db component would mean the datasource never got picked up.
          grep -q '"db"' /tmp/health.json

      - name: Check endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:4000/ | grep -q 'Welcome'
          curl --fail --silent --show-error http://localhost:4000/get-example-case | grep -q 'ABC12345'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [build-test, static-analysis, terraform, image, compose-smoke]
    steps:
      - name: Check gate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [[ "$r" != "success" ]]; then
              echo "::error::One or more required gates did not pass."
              exit 1
            fi
          done
          echo "All gates green."

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ci-passed, image]
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'test' }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: 'true'
      TF_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'test' }}
      TF_VAR_container_image: ${{ needs.image.outputs.image_ref }}
      TF_VAR_builtFrom: ${{ github.sha }}
      TF_VAR_registry_username: ${{ github.actor }}
      TF_VAR_registry_password: ${{ secrets.GITHUB_TOKEN }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=hmcts-dev-test-backend/${TF_ENV}.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan -var="env=${TF_ENV}"

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          URL="$(terraform output -raw app_health_url)"
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "${URL}" | grep -q '"status":"UP"'; then
              echo "Healthy."
              exit 0
            fi
            echo "Attempt ${i} - not ready yet."
            sleep 10
          done
          echo "::error::Service did not become healthy after deploy."
          exit 1
