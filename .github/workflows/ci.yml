name: CI Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # JOB 1: PATH FILTER (Detect Infrastructure vs. Application Changes)
  # =========================================================================
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Evaluate Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'infrastructure/**'
            app:
              - '!infrastructure/**'

  # =========================================================================
  # JOB 2: TERRAFORM INFRASTRUCTURE CHECKS (Runs only on infrastructure/ changes)
  # =========================================================================
  terraform-checks:
    name: Terraform Format & Validate
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/

      - name: Terraform Init (Local Backend)
        run: terraform -chdir=infrastructure init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infrastructure validate

  # =========================================================================
  # JOB 3: BUILD, TEST & STATIC ANALYSIS (Runs on non-TF changes)
  # =========================================================================
  build-and-test:
    name: Compile, Test & Lint Application
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Removed cache: 'gradle' to prevent cache conflicts with setup-gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # The uk.gov.hmcts.java plugin automatically wires Checkstyle into 'check'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile, Check & Test
        run: ./gradlew check

      - name: Upload Test & Checkstyle Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-reports
          path: |
            build/reports/tests/test/
            build/reports/checkstyle/

  # =========================================================================
  # JOB 4: CONTAINER BUILD, TRIVY SCAN & PUBLISH (Runs on non-TF changes)
  # =========================================================================
  container-ci:
    name: Container Build & Vulnerability Scan
    needs: [changes, build-and-test]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata: Short SHA tag + repository linking labels
      - name: Extract Docker Metadata (Short SHA Tag & OCI Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Build image locally using your Multi-Stage Dockerfile
      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- TRIVY VULNERABILITY SCANNING GATES ---

      # 1. Non-blocking warning scan for HIGH severity vulnerabilities
      - name: Trivy Scan - HIGH Vulnerabilities (Warning Only)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:scan-target'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH'

      # 2. Hard-blocking gate for CRITICAL severity vulnerabilities
      - name: Trivy Scan - CRITICAL Vulnerabilities (Pipeline Block)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:scan-target'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # Push image to GHCR ONLY on branch merges (not on PRs) after all gates pass
      - name: Push Container Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
