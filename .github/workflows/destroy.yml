name: Destroy

# Manual only, and prd is not an option. Tearing down production is a
# deliberate act with a change record, not a button in a workflow list.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options: [dev, tst, stg]
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string

permissions:
  contents: read

env:
  TERRAFORM_DIR: infrastructure/terraform

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::Confirmation does not match the selected environment."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform
        with:
          state-resource-group: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          state-storage-account: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          state-key: cms/${{ inputs.environment }}.tfstate

      # image_tag has no default but is required by the configuration. Any
      # value satisfies it here because nothing is being created.
      - name: Destroy
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform destroy -input=false -lock-timeout=5m -auto-approve \
            -var-file="envs/${{ inputs.environment }}.tfvars" \
            -var="image_tag=unused"
