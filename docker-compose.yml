name: hmcts-dev-test

services:
  db:
    image: postgres:16-alpine
    container_name: hmcts-dev-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME - copy .env.example to .env}
      POSTGRES_USER: ${DB_USER_NAME:?set DB_USER_NAME - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD - copy .env.example to .env}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmcts/test-backend:local
    container_name: hmcts-dev-test-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db-data:
