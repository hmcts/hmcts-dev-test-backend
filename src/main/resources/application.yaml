server:
  port: ${SERVER_PORT:4000}
  shutdown: "graceful"

management:
  endpoint:
    health:
      # Set to "never" where ingress is public.
      show-details: ${HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true
      group:
        readiness:
          # readinessState must stay: declaring the group replaces the default.
          include: "readinessState,db"
  endpoints:
    web:
      base-path: /
      exposure:
        include: info,health

springdoc:
  packagesToScan: uk.gov.hmcts.reform.dev.controllers
  writer-with-order-by-keys: true

spring:
  config:
    import: "optional:configtree:/mnt/secrets/test/"
  application:
    name: Dev Test
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}${DB_OPTIONS:}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    properties:
      charSet: UTF-8
    hikari:
      minimumIdle: 2
      maximumPoolSize: 10
      idleTimeout: 10000
      poolName: DevTestHikariCP
      maxLifetime: 7200000
      connectionTimeout: 30000
# spring.jpa is omitted: only spring-boot-starter-jdbc is on the classpath.
